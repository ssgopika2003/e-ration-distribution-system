<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete Product - {{ product.prd_name }} - Delight Mobiles</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body style="background:linear-gradient(180deg, rgba(240,195,142,0.10) 0%, rgba(241,170,155,0.08) 40%, rgba(72,66,109,0.05) 100%);">
  <div class="admin-main-content" style="min-height:100vh;">
  {% include 'admin/admin_nav.html' %}

    <main class="py-4">
    <div class="admin-content">
      <div class="card shadow border-0" style="max-width:500px;margin:0 auto;border-radius:16px;">
        <div class="card-header text-center" style="background:linear-gradient(135deg,#312C51,#48426D);color:#fff;border-top-left-radius:16px;border-top-right-radius:16px;">
          <h4 class="mb-0">Delete Product</h4>
        </div>
        <div class="card-body text-center">
          <div class="mb-3">
            {% if product.prd_image %}
              <img src="{{ product.prd_image.url }}" class="img-fluid rounded" style="max-height:150px;object-fit:cover;">
            {% else %}
              <div class="d-flex align-items-center justify-content-center bg-light rounded mx-auto" style="height:150px;width:150px;color:#888;">No image</div>
            {% endif %}
          </div>
          <h5 class="mb-3">{{ product.prd_name }}</h5>
          <p class="text-muted mb-4">Are you sure you want to delete this product? This action cannot be undone.</p>
          
          <form method="post" style="display:inline;">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
              <a href="{% url 'admin_view_products' %}" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-danger">Delete Product</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    </main>
  </div>
</body>
</html>

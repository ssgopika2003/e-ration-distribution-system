<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  </head>
  <body>
    <div class="admin-main-content" style="min-height:100vh;">
    {% include 'admin/admin_nav.html' %}

      <main class="py-4">
      <div class="admin-content">
        <h1>Edit User: {{ user.username }}</h1>
        {% include 'messages.html' %}
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="form-group">
            <label>Address</label>
            <input class="form-control" name="address" value="{{ profile.address }}">
          </div>
          <div class="form-group">
            <label>Contact No</label>
            <input class="form-control" name="contact_no" value="{{ profile.contact_no }}">
          </div>
          <div class="form-group">
            <label>Image</label>
            <input type="file" name="image" class="form-control-file">
          </div>
          <button class="btn btn-primary" type="submit">Save</button>
            <div class="d-flex justify-content-start gap-2 mt-3">
                <a href="{% url 'admin_view_users' %}" class="btn btn-secondary">Cancel</a>
                <form method="post" action="{% url 'admin_delete_user' user.id %}" style="display:inline;margin-left:8px;" onsubmit="return confirm('Are you sure you want to delete this user?')">
                  {% csrf_token %}
                  <button type="submit" class="btn btn-danger">Delete User</button>
                </form>
            </div>
        </form>
      </div>
      </main>
    </div>
  </body>
</html>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#userNav" aria-controls="userNav" aria-expanded="false" aria-label="Toggle navigation" onclick="console.log('Hamburger menu clicked')">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="userNav">

        <li class="nav-item mr-2"><a class="nav-link" href="{% url 'cart_page' %}"><i class="fas fa-shopping-cart mr-1"></i>Cart <span class="badge badge-pill" style="background:#F1AA9B;color:#312C51">{{ cart_count|default:0 }}</span></a></li>
        <li class="nav-item dropdown mr-2">
          <button class="btn btn-sm dropdown-toggle" style="background:#F0C38E;color:#312C51;border-radius:8px;font-weight:600" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" onclick="console.log('Categories dropdown clicked')">

            <span class="dropdown-item-text text-muted">No categories</span>
          {% endfor %}
          </div>

            {% endfor %}

<!-- Bootstrap JavaScript for dropdown functionality -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Ensure dropdown works on mobile
  document.addEventListener('DOMContentLoaded', function() {
    // Initialize Bootstrap dropdowns
    $('.dropdown-toggle').dropdown();
    
    // Custom mobile dropdown handling
    var dropdown = document.querySelector('.nav-item.dropdown');
    if(dropdown) {
      var btn = dropdown.querySelector('button');
      var menu = dropdown.querySelector('.dropdown-menu');
      
      if(btn && menu) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          menu.classList.toggle('show');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
          if (!dropdown.contains(e.target)) {
            menu.classList.remove('show');
          }
        });
      }
    }
  });
</script>

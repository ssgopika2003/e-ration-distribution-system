{% extends 'user/user_nav.html' %}

{% block user_content %}
  <main class="py-4">
    <div class="container">
      <div class="card border-0 shadow-sm mb-4" style="border-radius:16px;">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <span class="h5 mb-0 mr-3">Welcome, {{ request.user.username }}</span>
          </div>
          <div>
            <a href="{% url 'user_profile' %}" class="btn btn-sm mr-2" style="background:#F0C38E;color:#312C51;border-radius:8px;font-weight:600;">
              <i class="fas fa-user mr-1"></i>View Profile
            </a>
            <a href="{% url 'edit_profile' %}" class="btn btn-danger btn-sm" style="border-radius:8px;font-weight:600;">
              <i class="fas fa-edit mr-1"></i>Edit Profile
            </a>
          </div>
        </div>
      </div>

      <div class="row">
        {% for p in products %}
        <div class="col-sm-6 col-md-4 col-lg-3 mb-4">
          <div class="card h-100 border-0 shadow-sm" style="border-radius:16px;">
            {% if p.prd_image %}
            <img class="card-img-top" src="{{ p.prd_image.url }}" style="height:180px;object-fit:cover;border-top-left-radius:16px;border-top-right-radius:16px;width:100%;" alt="{{ p.prd_name }}">
            {% else %}
            <div class="d-flex align-items-center justify-content-center" style="height:180px;background:linear-gradient(135deg,#f7f5fb,#e8e4f0);border-top-left-radius:16px;border-top-right-radius:16px;color:#888;">
              <div class="text-center">
                <i class="fas fa-image fa-2x mb-2"></i>
                <div>No image</div>
              </div>
            </div>
            {% endif %}
            <div class="card-body text-center">
              <h6 class="card-title mb-1">{{ p.prd_name }}</h6>
              <p class="text-danger font-weight-bold mb-0">₹{{ p.prd_price }}</p>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </main>
{% endblock %}

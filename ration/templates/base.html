<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kerala Ration Shop - Essential Goods Store{% endblock %}</title>
    
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --primary: #2c3e50;
        --secondary: #3498db;
        --accent: #e74c3c;
        --success: #27ae60;
        --warning: #f39c12;
        --info: #17a2b8;
        --light: #f8f9fa;
        --dark: #2c3e50;
        --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        --shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.175);
        --border-radius: 0.5rem;
        --border-radius-lg: 1rem;
        --transition: all 0.3s ease;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: var(--dark);
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        font-size: 16px;
      }

      /* Professional Navbar */
      .navbar-theme {
        background: var(--gradient-primary) !important;
        box-shadow: var(--shadow);
        border: none;
        padding: 1rem 0;
        transition: var(--transition);
      }

      .navbar-theme .navbar-brand {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: white !important;
        text-decoration: none;
        transition: var(--transition);
      }

      .navbar-theme .navbar-brand:hover {
        transform: translateY(-2px);
        color: #f8f9fa !important;
      }

      .navbar-theme .nav-link {
        color: rgba(255, 255, 255, 0.9) !important;
        font-weight: 500;
        padding: 0.5rem 1rem !important;
        border-radius: var(--border-radius);
        transition: var(--transition);
        margin: 0 0.25rem;
      }

      .navbar-theme .nav-link:hover {
        color: white !important;
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }

      .navbar-theme .dropdown-menu {
        border: none;
        box-shadow: var(--shadow-lg);
        border-radius: var(--border-radius);
        padding: 0.5rem 0;
        margin-top: 0.5rem;
      }

      .navbar-theme .dropdown-item {
        padding: 0.75rem 1.5rem;
        font-weight: 500;
        transition: var(--transition);
      }

      .navbar-theme .dropdown-item:hover {
        background: var(--gradient-primary);
        color: white;
        transform: translateX(5px);
      }

      /* Professional Buttons */
      .btn {
        font-weight: 500;
        border-radius: var(--border-radius);
        padding: 0.75rem 1.5rem;
        transition: var(--transition);
        border: none;
        text-transform: none;
        letter-spacing: 0.5px;
      }

      .btn-primary {
        background: var(--gradient-primary);
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
        background: var(--gradient-primary);
      }

      .btn-danger {
        background: var(--gradient-secondary);
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
        background: var(--gradient-secondary);
      }

      .btn-success {
        background: var(--gradient-success);
        color: white;
        box-shadow: var(--shadow-sm);
      }

      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
        background: var(--gradient-success);
      }

      .btn-outline-primary {
        border: 2px solid var(--primary);
        color: var(--primary);
        background: transparent;
      }

      .btn-outline-primary:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      /* Professional Cards */
      .card {
        border: none;
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
        overflow: hidden;
        background: white;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
      }

      .card-header {
        background: var(--gradient-primary);
        color: white;
        border: none;
        padding: 1.5rem;
        font-weight: 600;
      }

      .card-body {
        padding: 2rem;
      }

      .card-footer {
        background: var(--light);
        border: none;
        padding: 1.5rem;
      }

      /* Professional Forms */
      .form-control {
        border: 2px solid #e9ecef;
        border-radius: var(--border-radius);
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: var(--transition);
        background: white;
      }

      .form-control:focus {
        border-color: var(--secondary);
        box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        background: white;
      }

      .form-group label {
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 0.5rem;
      }

      .input-group-text {
        background: var(--light);
        border: 2px solid #e9ecef;
        border-right: none;
        color: var(--dark);
        font-weight: 500;
      }

      .input-group .form-control {
        border-left: none;
      }

      .input-group .form-control:focus {
        border-left: none;
      }

      /* Professional Typography */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 1rem;
      }

      h1 { font-size: 2.5rem; }
      h2 { font-size: 2rem; }
      h3 { font-size: 1.75rem; }
      h4 { font-size: 1.5rem; }
      h5 { font-size: 1.25rem; }
      h6 { font-size: 1rem; }

      .display-1, .display-2, .display-3, .display-4 {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
      }

      /* Professional Alerts */
      .alert {
        border: none;
        border-radius: var(--border-radius);
        padding: 1rem 1.5rem;
        font-weight: 500;
        box-shadow: var(--shadow-sm);
      }

      .alert-success {
        background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        color: #155724;
        border-left: 4px solid var(--success);
      }

      .alert-danger {
        background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
        color: #721c24;
        border-left: 4px solid var(--accent);
      }

      .alert-warning {
        background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
        color: #856404;
        border-left: 4px solid var(--warning);
      }

      .alert-info {
        background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
        color: #0c5460;
        border-left: 4px solid var(--info);
      }

      /* Professional Footer */
      footer {
        background: var(--gradient-primary);
        color: white;
        padding: 2rem 0;
        margin-top: auto;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        body { font-size: 14px; }
        .navbar-theme .navbar-brand { font-size: 1.25rem; }
        .btn { padding: 0.5rem 1rem; font-size: 0.9rem; }
        .card-body { padding: 1.5rem; }
        h1 { font-size: 2rem; }
        h2 { font-size: 1.75rem; }
        h3 { font-size: 1.5rem; }
      }

      @media (max-width: 576px) {
        .container { padding: 0 1rem; }
        .btn { width: 100%; margin-bottom: 0.5rem; }
        .card-body { padding: 1rem; }
        .navbar-theme { padding: 0.5rem 0; }
      }

      /* Loading States */
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }

      .spinner-border-sm {
        width: 1rem;
        height: 1rem;
      }

      /* Custom Utilities */
      .text-gradient {
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .bg-gradient-primary {
        background: var(--gradient-primary);
      }

      .bg-gradient-secondary {
        background: var(--gradient-secondary);
      }

      .shadow-custom {
        box-shadow: var(--shadow-lg);
      }

      .border-radius-custom {
        border-radius: var(--border-radius-lg);
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-theme">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
          <i class="fas fa-store mr-2"></i>
          Kerala Ration Shop
        </a>
        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ml-auto align-items-center">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="signupDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-user-plus mr-1"></i>
                Sign Up
              </a>
              <div class="dropdown-menu dropdown-menu-right" aria-labelledby="signupDropdown">
                <a class="dropdown-item" href="{% url 'register' %}">
                  <i class="fas fa-user mr-2"></i>Customer
                </a>
                <a class="dropdown-item" href="{% url 'shop_owner_register' %}">
                  <i class="fas fa-store mr-2"></i>Shop Owner
                </a>
              </div>
            </li>
            <li class="nav-item ml-2">
              <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">
                <i class="fas fa-sign-in-alt mr-1"></i>
                Login
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>


    {% block content %}{% endblock %}

    <footer class="mt-auto">
      <div class="container">
        <div class="row py-4">
          <div class="col-md-6 text-md-left text-center mb-3 mb-md-0">
            <h5 class="text-white mb-2">
              <i class="fas fa-store mr-2"></i>
              Kerala Ration Shop
            </h5>
            <p class="text-white-50 mb-0">Essential goods for every household</p>
          </div>
          <div class="col-md-6 text-md-right text-center">
            <div class="social-links mb-3">
              <a href="#" class="text-white-50 mr-3">
                <i class="fab fa-facebook-f"></i>
              </a>
              <a href="#" class="text-white-50 mr-3">
                <i class="fab fa-twitter"></i>
              </a>
              <a href="#" class="text-white-50 mr-3">
                <i class="fab fa-instagram"></i>
              </a>
              <a href="#" class="text-white-50">
                <i class="fab fa-linkedin-in"></i>
              </a>
            </div>
            <p class="text-white-50 mb-0">
              © {% now "Y" %} Kerala Ration Shop. All rights reserved.
            </p>
          </div>
        </div>
      </div>
    </footer>

    <!-- jQuery, Popper.js, and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <script>
    // Enhanced JavaScript functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Auto-dismiss alerts after 5 seconds
        const alerts = document.querySelectorAll('.alert[data-auto-dismiss="true"]');
        alerts.forEach(function(alert) {
            setTimeout(function() {
                if (alert && alert.parentNode) {
                    alert.style.transition = 'opacity 0.5s ease-out';
                    alert.style.opacity = '0';
                    setTimeout(function() {
                        if (alert.parentNode) {
                            alert.parentNode.removeChild(alert);
                        }
                    }, 500);
                }
            }, 5000);
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add loading states to forms
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function() {
                const submitBtn = this.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm mr-2"></span>Processing...';
                    
                    // Re-enable after 10 seconds as fallback
                    setTimeout(() => {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalText;
                    }, 10000);
                }
            });
        });

        // Add hover effects to cards
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px)';
            });
            card.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    });
    </script>
  </body>
</html>

{% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show message-alert"
           role="alert" data-auto-dismiss="true">
        <i class="fas fa-{% if message.tags == 'success' %}check-circle
                        {% elif message.tags == 'error' %}exclamation-triangle
                        {% elif message.tags == 'warning' %}exclamation-circle
                        {% else %}info-circle{% endif %} me-2"></i>
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

<!-- ✅ Include Bootstrap JS (Bootstrap 5) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ✅ Optional: Auto-dismiss after 4 seconds -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const alerts = document.querySelectorAll('.alert[data-auto-dismiss="true"]');
    alerts.forEach(alert => {
      setTimeout(() => {
        const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
        bsAlert.close();
      }, 4000); // close after 4 seconds
    });
  });
</script>

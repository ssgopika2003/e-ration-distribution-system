{% extends 'shop_owner/owner_nav.html' %}

{% block shop_owner_content %}
<main class="admin-content py-4">
  <div class="container">
    <div class="card p-3 shadow-sm">
      <h3 class="mb-3">Confirm Delete User</h3>
      <form method="post">{% csrf_token %}
        <p>Are you sure you want to delete <strong>{{ user.username }}</strong>?</p>
        <div class="d-flex">
          <button type="submit" class="btn btn-danger mr-2">Delete</button>
          <a href="{% url 'view_users' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
